<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelada da Fé</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <img src="assets/img/logo.png" alt="Logo">
                <h3>Pelada da Fé</h3>
            </div>

            <ul class="menu">

                <li>
                    <a href="#" data-page="dashboard">
                        <i class="bi bi-house-door-fill"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="#" data-page="jogadores">
                        <i class="bi bi-people-fill"></i>
                        Jogadores
                    </a>
                </li>

                <li>
                    <a href="#" data-page="peladas">
                        <i class="bi bi-calendar-event-fill"></i>
                        Peladas
                    </a>
                </li>

                <li>
                    <a href="#" data-page="sorteio">
                        <i class="bi bi-shuffle"></i>
                        Sorteio
                    </a>
                </li>

                <li>
                    <a href="#" data-page="partidas">
                        <i class="bi bi-trophy-fill"></i>
                        Partidas
                    </a>
                </li>

                <li>
                    <a href="#" data-page="artilharia">
                        <i class="bi bi-dribbble"></i>
                        Artilharia
                    </a>
                </li>

                <li>
                    <a href="#" data-page="estatisticas">
                        <i class="bi bi-bar-chart-fill"></i>
                        Estatísticas
                    </a>
                </li>

                <li>
                    <a href="#" data-page="historico">
                        <i class="bi bi-clock-history"></i>
                        Histórico
                    </a>
                </li>

                <li>
                    <a href="#" data-page="configuracoes">
                        <i class="bi bi-gear-fill"></i>
                        Configurações
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Conteúdo -->
        <main class="content">

            <!-- Topo -->
            <header class="topbar">

                <button id="menu-btn" class="menu-btn">
                    <i class="bi bi-list"></i>
                </button>

                <div class="topbar-center">
                    <h2 id="tituloPagina">Dashboard</h2>
                    <small id="relogio"></small>
                </div>

                <div class="usuario">
                    <img src="assets/img/logo.png" alt="Logo">
                    <span>Administrador</span>
                </div>

            </header>

            <!-- Área dinâmica -->
            <section id="conteudo">

                <!-- dashboard.html será carregado aqui -->

            </section>

        </main>

    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Toastify -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script src="assets/js/utils.js"></script>

    <script src="assets/js/app.js"></script>

    <script src="assets/js/config.js"></script>

    <script src="assets/js/api.js"></script>

    <script src="assets/js/utils.js"></script>

    <script src="assets/js/services/jogadorService.js"></script>

    <script src="assets/js/app.js"></script>

</body>

</html>
